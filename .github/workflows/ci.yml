name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Exact commit this app is built against; bump after `bun exact.mjs update`.
  EXACT_REF: c9019c14f8144c134ccaa8abe0714511dd45a943
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Same layout as a developer's machine: the app and Exact side by side, so
    # the committed `../exact` paths (exact.mjs, Cargo.toml) resolve unchanged.
    defaults:
      run:
        working-directory: flashcard-exact
    steps:
      - uses: actions/checkout@v7
        with:
          path: flashcard-exact

      - uses: actions/checkout@v7
        with:
          repository: expo/exact
          ref: ${{ env.EXACT_REF }}
          path: exact

      - name: Rust (app's rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flashcard-exact -> target
          key: ${{ env.EXACT_REF }}
          cache-on-failure: true

      - name: Exact's Bun dependencies
        working-directory: exact
        run: bun install --frozen-lockfile

      - name: Cargo dependencies
        id: deps
        run: cargo fetch --locked

      # Every check runs once setup succeeded, even if an earlier check failed,
      # so one run reports everything.
      - name: contract fmt
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bun exact.mjs contract fmt --check app.contract

      - name: contract build (lint)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bun exact.mjs contract build app.contract

      - name: cargo fmt
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo fmt --all --check

      # flashcard-apple is the iOS/macOS host crate; it is not checked on Linux.
      - name: cargo clippy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo clippy --locked --offline --workspace --exclude flashcard-apple -- -D warnings

      # What iOS runs when the dev loop replaces the Rust module.
      - name: cargo check logic (wasm32)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo check --locked --offline -p flashcard-logic --target wasm32-unknown-unknown
